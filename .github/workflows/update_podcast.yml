name: Update Podcast RSS Feed

on:
  schedule:
    # Run daily at 21:00 UTC (00:00 Israel Summer Time)
    - cron: '0 21 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  update-feed:
    runs-on: ubuntu-latest

    # We need contents: write permission to commit back to the repo and create releases
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Worker 16 adds the «בעין טובה» episode the moment a talk is published, and keeps direct-add.json
      # fresh while it does (17/11/2026). Following the playlist is then left to it. A missing or stale
      # marker, or any failure here, means: follow as before.
      - name: Is the worker adding episodes directly?
        id: gate
        run: python3 direct_add.py gate >> "$GITHUB_OUTPUT" || echo "follow=true" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.gate.outputs.follow != 'false'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.gate.outputs.follow != 'false'
        run: |
          python -m pip install --upgrade pip
          # yt-dlp requires ffmpeg for audio extraction
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install --upgrade -r requirements.txt
          # Use nightly yt-dlp to bypass youtube bot detection
          pip install -U https://github.com/yt-dlp/yt-dlp/archive/master.tar.gz

      - name: Run podcast updater script
        if: steps.gate.outputs.follow != 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python podcast_updater.py

      - name: Commit and push changes
        if: steps.gate.outputs.follow != 'false'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          # Only commit if there are changes
          git diff --staged --quiet || (git commit -m "Automated podcast feed update" && git push)
